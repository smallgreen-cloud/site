schema_version: "0.1.0"
health:
  path: /
  expect_status: 200
smoke:
  - name: 首頁載入
    steps:
      - action: http_request
        params: { method: GET, path: / }
    expect: { status: 200 }
    idempotency: true
user_acceptance:
  - task: 雙語首頁、核心資訊頁與服務目錄皆可直接存取
    success_looks_like: 英文根目錄與 /zh-tw/ 均為 200；manifesto、concepts、services、standard、evidence、faq 兩種語言各自存在
  - task: Registry 每張服務卡各產生英文與繁中詳頁
    success_looks_like: /services/{id}/ 與 /zh-tw/services/{id}/ 數量皆等於 registry cards/；舊 /s/{id}.html 指向英文 canonical URL
  - task: 檢查零第三方 runtime 資源載入（信任揭露自我一致）
    success_looks_like: script、style、font、image 僅使用本站路徑；GitHub 等外部網址只作使用者主動點擊的連結
  - task: 檢查雙語搜尋契約
    success_looks_like: 每個語言版本 self-canonical，互列 en、zh-Hant-TW、x-default hreflang；sitemap 也包含語言對
  - task: 任一卡的 upstream、adapter 與 Evidence Pack 連結可達
    success_looks_like: 目標 GitHub 公開路徑 HTTP 200，且頁面沒有暴露 private URL、account ID 或 secret
uninstall_check:
  resource_zero_diff: true
